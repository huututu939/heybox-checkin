version: 2

updates:
  # Gradle 依赖：每周一次，按组提 PR，避免一次开一堆
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-gradle:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.application"

  # Actions 版本：每月一次
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
